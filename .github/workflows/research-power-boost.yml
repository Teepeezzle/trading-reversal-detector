name: Research — Power Boost / Phase 4.5 (off-peak)

# PHASE 4.5: pre-registered confirmation of the regime-gated breakout lead under data configs that
# add TRADES per hypothesis (crypto 15m; cross-class pool), evaluated on the cached OHLCV lake.
# Run this AFTER research-data-refresh has fetched the widened crypto universe into the lake cache.
# Reads the cache only — no data pulled here, no secrets. Lands POWER_BOOST.md as a PR.
#
# ONE-TIME SETTING (if create-PR is denied): repo Settings -> Actions -> General ->
# Workflow permissions -> enable "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-power-boost
  cancel-in-progress: false

jobs:
  power:
    name: Run power-boost confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Restore data lake (from research-data-refresh)
        uses: actions/cache/restore@v5
        with:
          key: research-power-readonly
          path: research/data
          restore-keys: |
            research-lake-

      - name: Run power-boost confirmation
        run: python research/jobs/power_boost.py

      - name: Open/update results PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: research/POWER_BOOST.md
          branch: research/power-boost
          base: main
          commit-message: "research: Phase-4.5 power-boost results (auto)"
          title: "research: Phase-4.5 power-boost confirmation (auto)"
          body: |
            Auto-generated Phase-4.5 confirmation of the regime-gated crypto breakout under
            trade-adding data configs (15m; cross-class pool) on the widened crypto universe.
            A cell that clears 2x-cost + Bonferroni + DSR>0.95 is a genuine candidate — but 15m
            history is shallow (~52d), so Phase-5 walk-forward + forward paper remain mandatory
            before deployment.
          delete-branch: false
