name: Research — Combo Sweep / Phase 4 (off-peak)

# PHASE 4 / T-401: cross every Phase-3 base-gate PASS lead (read from HYPOTHESIS_REGISTRY.csv) with
# each regime/confirmation gate in factors.GATES, evaluate the combined rule pooled/no-lookahead/
# net-of-cost, and append phase-4 rows. Idempotent (skips ids already present), resumable (--max).
# Reads the cached OHLCV lake (built by research-data-refresh); no data pulled here, no secrets.
#
# Manual dispatch — run after Phase 3 has populated the leads. Lands the updated registry as a PR.
#
# ONE-TIME SETTING (if the create-PR step is denied): repo Settings -> Actions -> General ->
# Workflow permissions -> enable "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      max:
        description: "max NEW hypotheses this run (resumable; 0=unlimited)"
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-combo-sweep
  cancel-in-progress: false

jobs:
  combo:
    name: Run Phase-4 combo sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Restore data lake (from research-data-refresh)
        uses: actions/cache/restore@v5
        with:
          key: research-combo-readonly
          path: research/data
          restore-keys: |
            research-lake-

      - name: Run combo sweep
        run: |
          python research/jobs/combo_sweep.py --max "${{ github.event.inputs.max || '0' }}" --rc_iters 8

      - name: Open/update results PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: research/HYPOTHESIS_REGISTRY.csv
          branch: research/combo-results
          base: main
          commit-message: "research: Phase-4 combo sweep results (auto)"
          title: "research: Phase-4 combo sweep results (auto-updating)"
          body: |
            Auto-generated by the Phase-4 combo sweep: Phase-3 leads x regime gates. New phase-4
            rows appended to HYPOTHESIS_REGISTRY.csv (idempotent). Any PASS still needs the T-303
            gauntlet (run research-robustness with phase=4) before becoming a candidate.
          delete-branch: false
