name: Research — Cross-Sectional Sweep / Phase 6 (off-peak)

# PHASE 6 cross-sectional relative-strength sweep: rank a class's instruments by trailing momentum,
# hold long top-k / short bottom-k for H bars (non-overlapping), net of cost. Grid over class x TF x
# (L,H) x k x mode. Appends phase-6 rows to HYPOTHESIS_REGISTRY.csv. Reads the cached lake; no data
# pulled here, no secrets. Idempotent + resumable (--max). Judge with research-robustness (phase=6).
#
# ONE-TIME SETTING (if create-PR is denied): repo Settings -> Actions -> General ->
# Workflow permissions -> enable "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      aclass:
        description: "'all' or CSV e.g. 'crypto' / 'forex_majors,forex_crosses'"
        required: false
        default: "all"
      max:
        description: "max NEW hypotheses this run (resumable; 0=unlimited)"
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-xsweep
  cancel-in-progress: false

jobs:
  xsweep:
    name: Run Phase-6 cross-sectional sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Restore data lake (from research-data-refresh)
        uses: actions/cache/restore@v5
        with:
          key: research-xsweep-readonly
          path: research/data
          restore-keys: |
            research-lake-

      - name: Run cross-sectional sweep
        run: |
          python research/jobs/xs_sweep.py \
            --aclass "${{ github.event.inputs.aclass || 'all' }}" \
            --max "${{ github.event.inputs.max || '0' }}" \
            --rc_iters 8

      - name: Open/update results PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: research/HYPOTHESIS_REGISTRY.csv
          branch: research/xsweep-results
          base: main
          commit-message: "research: Phase-6 cross-sectional sweep results (auto)"
          title: "research: Phase-6 cross-sectional sweep results (auto-updating)"
          body: |
            Auto-generated Phase-6 cross-sectional (relative-strength) sweep. New phase-6 rows appended
            to HYPOTHESIS_REGISTRY.csv (idempotent). Judge with research-robustness (phase=6); any PASS
            still needs the full gauntlet before it is a candidate.
          delete-branch: false
