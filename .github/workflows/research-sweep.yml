name: Research — Sweep (off-peak)

# PHASE 3 systematic single-factor sweep. Restores the OHLCV lake (built by research-data-refresh)
# from the shared Actions cache, runs a BOUNDED, RESUMABLE batch of hypotheses (idempotent — skips
# ids already in HYPOTHESIS_REGISTRY.csv), and lands the updated registry as a PR for review.
# $0: no data pulled here (reads the cached lake); no secrets needed.
#
# Runs after research-data-refresh (which warms the lake cache). Scheduled runs fire only from the
# default branch, so this activates once merged to main.
#
# ONE-TIME SETTING (if the create-PR step is denied): repo Settings -> Actions -> General ->
# Workflow permissions -> enable "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "30 23 * * *"      # 23:30 UTC, ~1h after the 22:30 data-refresh
  workflow_dispatch:
    inputs:
      aclass:
        description: "'all' or CSV e.g. 'crypto' / 'forex_majors,metals'"
        required: false
        default: "all"
      max:
        description: "max NEW hypotheses this run (resumable; 0=unlimited)"
        required: false
        default: "60"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Run single-factor sweep batch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid the create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Restore data lake (from research-data-refresh)
        uses: actions/cache/restore@v5
        with:
          path: research/data
          key: research-lake-sweep-readonly
          restore-keys: |
            research-lake-

      - name: Run sweep batch
        run: |
          python research/jobs/sweep.py \
            --aclass "${{ github.event.inputs.aclass || 'all' }}" \
            --max "${{ github.event.inputs.max || '60' }}" \
            --rc_iters 8

      - name: Open/update results PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: research/HYPOTHESIS_REGISTRY.csv
          branch: research/sweep-results
          base: main
          commit-message: "research: sweep results batch (auto)"
          title: "research: Phase-3 sweep results (auto-updating)"
          body: |
            Auto-generated by the nightly sweep. New hypotheses appended to HYPOTHESIS_REGISTRY.csv
            (idempotent — resumes across nights). Review the `survived` column; any PASS still needs
            2x-cost + parameter-sensitivity + multiple-testing correction before becoming a candidate.
          delete-branch: false
