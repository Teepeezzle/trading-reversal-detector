name: Research — Robustness / T-303 (off-peak)

# PHASE 3 / T-303 gauntlet: takes every base-gate PASS already in HYPOTHESIS_REGISTRY.csv and
# subjects it to 2x cost + parameter sensitivity + multiple-testing correction (Bonferroni +
# Deflated Sharpe), promoting ONLY what survives all of them into CANDIDATES.md. Reads the cached
# OHLCV lake (built by research-data-refresh); no data pulled here, no secrets needed.
#
# Deliberately manual (workflow_dispatch) — you run it after a sweep batch has populated the
# registry, not on a blind nightly timer. Lands CANDIDATES.md + ROBUSTNESS.md as a PR for review.
#
# ONE-TIME SETTING (if the create-PR step is denied): repo Settings -> Actions -> General ->
# Workflow permissions -> enable "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "trial family to judge: '3', '4', or 'all'"
        required: false
        default: "3"
      alpha:
        description: "family-wise error rate (Bonferroni)"
        required: false
        default: "0.05"
      dsr:
        description: "min Deflated Sharpe Ratio to promote"
        required: false
        default: "0.95"
      promote:
        description: "write survivors into CANDIDATES.md (true/false)"
        required: false
        default: "true"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-robustness
  cancel-in-progress: false

jobs:
  robustness:
    name: Run T-303 robustness gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid the create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Restore data lake (from research-data-refresh)
        uses: actions/cache/restore@v5
        with:
          path: research/data
          key: research-robustness-readonly
          restore-keys: |
            research-lake-

      - name: Run robustness gauntlet
        run: |
          PROMOTE=""
          if [ "${{ github.event.inputs.promote || 'true' }}" = "true" ]; then PROMOTE="--promote"; fi
          python research/jobs/robustness.py \
            --phase "${{ github.event.inputs.phase || '3' }}" \
            --alpha "${{ github.event.inputs.alpha || '0.05' }}" \
            --dsr "${{ github.event.inputs.dsr || '0.95' }}" \
            $PROMOTE

      - name: Open/update candidates PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            research/CANDIDATES.md
            research/ROBUSTNESS.md
          branch: research/candidates
          base: main
          commit-message: "research: T-303 robustness results (auto)"
          title: "research: Phase-3 candidates after T-303 gauntlet (auto)"
          body: |
            Auto-generated by the T-303 robustness gauntlet. Every base-gate PASS in the registry
            was re-run at 2x cost, perturbed for parameter sensitivity, and corrected for multiple
            testing (Bonferroni + Deflated Sharpe). Only survivors of ALL four tests are promoted
            into CANDIDATES.md. See ROBUSTNESS.md for the full per-candidate report.

            A promoted candidate is still NOT deployed — it has not touched the sealed holdout or
            forward paper. Review before advancing to Phase 5.
          delete-branch: false
