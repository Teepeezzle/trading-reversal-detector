name: V5 Confluence Scan (aligned V5 + DRS + trend)

# Third independent scanner: the 3-way confluence (aligned V5 divergence + DRS
# support/resistance + 200-SMA) on the direction-specific shortlist. Emits
# [V5 CONFLUENCE] with entry/SL/TP and the static-base paper ledger.
#
# FULLY ISOLATED from the other two scanners: own concurrency group + own
# dedup/ledger cache namespace, so the three run in parallel and never block or
# corrupt each other.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      timeframes:
        description: "'auto' (route by clock), 'all', or CSV e.g. '1h,4h'"
        required: false
        default: "all"

concurrency:
  group: v5-confluence-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan confluence shortlist and email setups
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore confluence dedup + ledger state
        uses: actions/cache/restore@v5
        with:
          path: state
          key: v5-confluence-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v5-confluence-state-

      - name: Run V5 confluence scan
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          BASE_EQUITY: ${{ secrets.BASE_EQUITY }}
          ACCOUNT_EQUITY: ${{ secrets.ACCOUNT_EQUITY }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          PYTHONIOENCODING: "utf-8"
        run: |
          python v5_confluence_scan.py --timeframes "${{ github.event.inputs.timeframes || 'auto' }}"

      - name: Save confluence dedup + ledger state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: v5-confluence-state-${{ github.run_id }}-${{ github.run_attempt }}
