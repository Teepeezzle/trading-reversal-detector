name: Fundamentals Forward Shadow Test (weekly)

# Track B. Weekly: record fresh confluence SETUPs with their point-in-time fundamental context + the
# three shadow uses (gate/score/tag, recorded not acted on), resolve matured outcomes, and report
# sample size + running stats -> forward_test/STATUS.md. Read-only market/fundamental data; NO secrets.
# Makes NO verdict; milestone gates (SHADOW_TEST.md / D-034) govern when a verdict may be attempted.
#
# Persists the updated log as a PR on branch `forward-test-data` (NOT auto-merged) so main is never
# changed without approval. DORMANT until the feature PR is approved + merged (schedules fire only from
# the default branch). After merge, review/merge the weekly data PR (or enable auto-merge then).
on:
  schedule:
    - cron: "20 6 * * 1"        # Mondays 06:20 UTC
  workflow_dispatch:
    inputs:
      cmd:
        description: "record | resolve | report | all"
        required: false
        default: "all"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fundamentals-forward-test
  cancel-in-progress: false

jobs:
  forward:
    name: Record / resolve / report the shadow log
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record / resolve / report
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python forward_test/forward_log.py "${{ github.event.inputs.cmd || 'all' }}"

      - name: Open/update forward-log PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            forward_test/signals.csv
            forward_test/shadow.csv
            forward_test/STATUS.md
          branch: forward-test-data
          base: main
          commit-message: "forward test: shadow log update (auto)"
          title: "forward test: fundamentals shadow log (auto-updating, Track B)"
          body: |
            Weekly forward shadow-test update: newly logged confluence SETUPs (+ point-in-time context +
            shadow gate/score/tag), newly resolved outcomes, and refreshed STATUS.md. No verdict — the
            milestone gates (n=100 read / 200 significance / 400 walk-forward; D-034) govern. Review +
            merge to accumulate; nothing here changes signals or the live board.
          delete-branch: false
