name: Research — News Refresh / Phase 9 (off-peak)

# Fetches timestamped macro-release data for the news layer (standing rule D-021): N-1 FRED (US
# macro: CPI/PCE/NFP/GDP/rates) + N-2 EIA (weekly crude inventories). Writes the canonical news table
# to research/altdata_committed/news/ (tracked, tiny, static) and lands it as a PR. Needs the
# FRED_API_KEY and EIA_API_KEY repo secrets.
#
# ONE-TIME SETTING (if create-PR denied): Settings -> Actions -> General -> Workflow permissions ->
# enable "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "50 4 * * *"      # 04:50 UTC daily (off-peak, staggered from the AV-sentiment job at 05:45)
  workflow_dispatch:
    inputs:
      start:
        description: "history start (YYYY-MM-DD)"
        required: false
        default: "2023-01-01"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-news-refresh
  cancel-in-progress: false

jobs:
  news:
    name: Fetch macro news (FRED + EIA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: News refresh (FRED + EIA + FMP calendar)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python research/jobs/news_refresh.py --start "${{ github.event.inputs.start || '2023-01-01' }}"

      - name: Regenerate daily briefing (N-6)
        run: python research/jobs/daily_brief.py

      - name: Open/update news PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            research/altdata_committed/news/*.csv.gz
            research/DAILY_SIGNALS.md
          branch: research/news-data
          base: main
          commit-message: "research: news-layer macro data (FRED + EIA) (auto)"
          title: "research: news-layer macro data — FRED + EIA (auto)"
          body: |
            Auto-generated timestamped macro-release table (N-1 FRED + N-2 EIA) for the news layer
            (D-021 / NEWS_LAYER.md). Canonical schema, no-lookahead (published_at/first_available_at).
            Auto-squash-merged so each day's macro releases land on main for the live board's
            fundamental-trend layer (same keep-current pattern as the AV-sentiment archive).
          delete-branch: false

      # Land the update on main so fundtrend/fundamentals read current FRED/EIA (otherwise the board's
      # USD-macro legs go stale, excluded by the max-age gate). Mirrors the AV-sentiment auto-merge
      # (scoped exception for auto-generated data on a fixed path, never code; reversible by deleting
      # this step). No-op when there was no new macro release (no PR opened).
      - name: Auto-merge news PR (land keep-current macro update)
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Squash-merging PR #${{ steps.cpr.outputs.pull-request-number }} (${{ steps.cpr.outputs.pull-request-operation }})"
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --repo "$GITHUB_REPOSITORY"
