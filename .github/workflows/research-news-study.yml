name: Research — News Study / Phase 9 N-5 (off-peak)

# Does a news GATE improve expectancy, or just cut trades? (standing rule D-021 §6). Compares each
# technical base rule to its news-gated variants on the cached lake (deep FX/metals from HistData +
# the committed news table), writes NEWS_STUDY.md, and appends the gated hypotheses to the registry
# as phase 9. Reads cache + committed news; no secrets. Richest once FRED macro news is present.
#
# ONE-TIME SETTING (if create-PR denied): Settings -> Actions -> General -> Workflow permissions ->
# enable "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      max:
        description: "max NEW gated cells this run (resumable; 0=unlimited)"
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-news-study
  cancel-in-progress: false

jobs:
  study:
    name: News-gate study (phase 9)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Restore data lake (deep FX/metals + crypto)
        uses: actions/cache/restore@v5
        with:
          key: research-newsstudy-readonly
          path: research/data
          restore-keys: |
            research-lake-

      - name: Run news-gate study
        run: python research/jobs/news_study.py --max "${{ github.event.inputs.max || '0' }}"

      - name: Open/update news-study PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            research/HYPOTHESIS_REGISTRY.csv
            research/NEWS_STUDY.md
          branch: research/news-study
          base: main
          commit-message: "research: Phase-9 news-gate study results (auto)"
          title: "research: Phase-9 news-gate study — base vs gated (auto)"
          body: |
            Auto-generated N-5 news-gate study (D-021 §6): base vs news-gated expectancy per rule, plus
            phase-9 gated hypotheses for the gauntlet. See NEWS_STUDY.md. A gate is a real edge only if
            it also clears the MTC bar (marked ✓MTC).
          delete-branch: false
