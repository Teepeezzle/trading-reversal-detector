name: V5 Parity Forward Tracker (daily OOS)

# Records the PARITY (H1) scanner's LIVE signals from deployment onward, resolves
# first-touch SL 1.5xATR / TP 4.0xATR outcomes within a 30-day horizon, and reports
# running out-of-sample expectancy -> forward_test/PARITY_STATUS.md. NO verdict;
# milestone gates (n=50/100/200) govern. Read-only market data; no secrets.
#
# The growing log lives on its own `parity-forward-data` branch. Each run seeds the
# CSV from that branch, appends, and updates the branch via create-pull-request, so
# the OOS sample accumulates reliably whether or not the data PR is merged to main.
# Schedules fire only from the default branch, so this is live once merged.
on:
  schedule:
    - cron: "40 6 * * *"        # daily 06:40 UTC (offset from the other data jobs)
  workflow_dispatch:
    inputs:
      cmd:
        description: "record | resolve | report | all"
        required: false
        default: "all"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: v5-parity-forward
  cancel-in-progress: false

jobs:
  forward:
    name: Record / resolve / report the parity OOS log
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid create-pull-request auth header clash

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Seed the accumulated log from the data branch (if it exists) so the sample
      # keeps growing across runs without requiring a merge to main.
      - name: Seed existing log from data branch
        run: |
          git fetch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            parity-forward-data:refs/remotes/origin/parity-forward-data || true
          if git cat-file -e origin/parity-forward-data:forward_test/parity_signals.csv 2>/dev/null; then
            git show origin/parity-forward-data:forward_test/parity_signals.csv > forward_test/parity_signals.csv
            echo "seeded $(wc -l < forward_test/parity_signals.csv) lines from data branch"
          else
            echo "no existing data branch log — starting fresh"
          fi

      - name: Record / resolve / report
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python forward_test/parity_forward.py "${{ github.event.inputs.cmd || 'all' }}"

      - name: Persist log to data branch (auto PR)
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            forward_test/parity_signals.csv
            forward_test/PARITY_STATUS.md
          branch: parity-forward-data
          base: main
          commit-message: "parity forward: OOS log update (auto)"
          title: "parity forward: V5 PARITY (H1) OOS tracker (auto-updating)"
          body: |
            Daily out-of-sample tracker for the V5 PARITY (H1) scanner: newly logged live
            signals (OOS from deploy), newly resolved first-touch SL/TP outcomes, and a
            refreshed PARITY_STATUS.md. No verdict — milestone gates (n=50/100/200) govern.
            The sample accumulates on this branch each run; merge to main only to snapshot.
          delete-branch: false
