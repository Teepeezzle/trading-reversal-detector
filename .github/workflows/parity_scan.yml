name: V5 Parity Scan (H1, hourly)

# Hourly scan of the user's "H1" divergence setup across every asset in
# config/parity_scanner.yaml, timeframes 45m/1h/2h/3h/4h. Runs as its own
# workflow with isolated dedup state so it never collides with the other
# scanners. Staggered to :13 to dodge GitHub's top-of-hour cron congestion.
#
# NOTE: GitHub cron is best-effort (5-30 min delays at peak). parity_scan.py
# floors the trigger to its 30-min slot and re-derives the last CLOSED bar
# from wall-clock, so delays don't break which bars are scanned.
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      timeframes:
        description: "'auto' (route by clock), 'all', or CSV e.g. '1h,4h'"
        required: false
        default: "all"

concurrency:
  group: v5-parity-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan all assets and email H1 parity divergences
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore alert-dedup state
        uses: actions/cache/restore@v5
        with:
          path: state
          key: parity-scan-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parity-scan-state-

      - name: Run V5 parity scan
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PYTHONIOENCODING: "utf-8"
        run: |
          python parity_scan.py --timeframes "${{ github.event.inputs.timeframes || 'auto' }}"

      - name: Save alert-dedup state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: parity-scan-state-${{ github.run_id }}-${{ github.run_attempt }}
