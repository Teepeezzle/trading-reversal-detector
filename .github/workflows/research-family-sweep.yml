name: Research — Family Sweep / Phase 5 (off-peak)

# PHASE 5 new-factor-family sweep: momentum (ROC), volatility breakout (Bollinger), trend-pullback
# (EMA), stochastic reversal, MACD momentum, across 15m/1h/2h/3h/4h/1D (2h,3h resampled from 1h).
# Pooled per asset class, no-lookahead, net-of-cost. Appends phase-5 rows to HYPOTHESIS_REGISTRY.csv.
# Idempotent + resumable (--max). Reads the cached OHLCV lake; no data pulled here, no secrets.
#
# Grid is large (~540). If a single run hits the timeout, re-dispatch — it resumes where it stopped.
# Judge results with research-robustness (phase=5).
#
# ONE-TIME SETTING (if create-PR is denied): repo Settings -> Actions -> General ->
# Workflow permissions -> enable "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_dispatch:
    inputs:
      aclass:
        description: "'all' or CSV e.g. 'crypto' / 'forex_majors,metals'"
        required: false
        default: "all"
      max:
        description: "max NEW hypotheses this run (resumable; 0=unlimited)"
        required: false
        default: "250"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-family-sweep
  cancel-in-progress: false

jobs:
  family:
    name: Run Phase-5 family sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false   # avoid create-pull-request "Duplicate header: Authorization" (HTTP 400)

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research deps
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Restore data lake (from research-data-refresh)
        uses: actions/cache/restore@v5
        with:
          key: research-family-readonly
          path: research/data
          restore-keys: |
            research-lake-

      - name: Run family sweep batch
        run: |
          python research/jobs/family_sweep.py \
            --aclass "${{ github.event.inputs.aclass || 'all' }}" \
            --max "${{ github.event.inputs.max || '250' }}" \
            --rc_iters 8

      - name: Open/update results PR
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: research/HYPOTHESIS_REGISTRY.csv
          branch: research/family-results
          base: main
          commit-message: "research: Phase-5 family sweep results (auto)"
          title: "research: Phase-5 new-factor-family sweep results (auto-updating)"
          body: |
            Auto-generated Phase-5 sweep: new factor families (momentum/breakout/pullback/stochastic/
            MACD) across 15m-1D. New phase-5 rows appended to HYPOTHESIS_REGISTRY.csv (idempotent;
            resumes across runs). Judge with research-robustness (phase=5); any PASS still needs the
            full gauntlet AND a broad cross-section before it is a candidate.
          delete-branch: false
