# Research universe + timeframes + session timing.
# Twelve Data symbol strings are the candidates; exact availability on the FREE plan is
# verified on first pull and recorded in DATA_MANIFEST.md (oil especially may differ).

# Working timeframes only (5m excluded — DECISIONS D-005). Twelve Data interval strings.
timeframes: ["15min", "1h", "4h", "1day"]

# Free-tier guardrails (DECISIONS D-003). Enforced in twelvedata_client.py.
rate:
  per_minute: 8
  per_day: 800
  outputsize: 5000        # max bars per call on free plan

# session: used by data_refresh to skip instruments whose session didn't run.
#   crypto = always; fx/metals = London+NY; oil = NY.
universe:
  forex_majors:
    session: fxmajor
    symbols: ["EUR/USD","GBP/USD","USD/JPY","USD/CHF","USD/CAD","AUD/USD","NZD/USD"]
  forex_crosses:
    session: fxmajor
    symbols: ["EUR/JPY","GBP/JPY","EUR/GBP","AUD/JPY","EUR/NZD","GBP/NZD","GBP/AUD"]
  metals:
    session: fxmajor
    symbols: ["XAU/USD"]                   # XAG/USD not on TD free -> yfinance (B-003 / D-008)
  crypto:
    session: always
    # Widened for Phase-4.5 power boost (more instruments -> more trades per hypothesis, no dilution).
    # New symbols that 404 on TD free are logged to BLOCKERS and skipped (data_refresh is tolerant).
    symbols: ["BTC/USD","ETH/USD","SOL/USD","XRP/USD","BNB/USD","DOGE/USD","AVAX/USD","LINK/USD","LTC/USD",
              "ADA/USD","DOT/USD","MATIC/USD","TRX/USD","ATOM/USD","BCH/USD","XLM/USD","UNI/USD","ETC/USD"]

# Instruments sourced from yfinance (B-003: not on Twelve Data free). Same lake format.
# These are SOLE-source (no TD cross-check possible). yfinance 15m ~60d, 1h ~730d.
yfinance:
  - {symbol: "XAG/USD",   yf: "SI=F", asset_class: metals, session: fxmajor}
  - {symbol: "WTI/USD",   yf: "CL=F", asset_class: oil,    session: ny}
  - {symbol: "BRENT/USD", yf: "BZ=F", asset_class: oil,    session: ny}
